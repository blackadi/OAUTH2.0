version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "server"
    ignore:
      # @authlete/typescript-sdk 1.1.5/1.1.6 are numerically higher than the current
      # stable 1.0.0 but predate it: Speakeasy auto-versioning ran up to 1.1.6 in
      # Nov 2025, upstream then reset to a 0.0.x beta line and promoted it to a
      # hand-set stable 1.0.0 in Apr 2026 (npm dist-tag `latest`). Those two versions
      # are older code that still carries the bugs 1.0.0 fixes, so never "upgrade" to
      # them. See docs/DEVELOPMENT.md → SDK Version Pin.
      - dependency-name: "@authlete/typescript-sdk"
        versions: ["1.1.5", "1.1.6"]

      # typescript-eslint does not support TypeScript 7.0 and says so by refusing
      # to load: "typescript-eslint does not support TS 7.0". `npm run lint` is a
      # CI gate on both the server and client jobs, so a TS 7 bump turns both red
      # while typecheck, build and the full suite stay green — the failure is in
      # the linter, not the code. Tracking: typescript-eslint#10940 (TS >=7.1).
      # Revisit when that issue closes; verified against 7.0.2 on 2026-08-20.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # express-request-id 2.x/3.x are pure ESM ("type": "module"). This server
      # compiles to CommonJS (tsconfig `module: node16`, and dist/app.js really
      # does emit `require("express-request-id")`), and `engines.node` is ">=22"
      # while `require(esm)` only landed unflagged in 22.12 — so the bump is a
      # runtime failure on any Node 22.0-22.11 the floor currently permits.
      # There is nothing to gain either: v3 only removes options this repo never
      # passes (`attributeName`, `uuidVersion`), and its shipped types.d.ts
      # declares `Express.Request` as a type alias rather than an interface
      # merge, which collides with this repo's own augmentation for `req.logger`.
      # If the transitive `uuid` advisory ever becomes reachable, replace the
      # package with `crypto.randomUUID()` rather than upgrading it.
      - dependency-name: "express-request-id"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "client"
    ignore:
      # Same reason as the server's: typescript-eslint refuses to load against
      # TypeScript 7.0, and `npm run lint` gates the client CI job too.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
