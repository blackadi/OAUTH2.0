name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC — only the external link check needs this. Documentation rots
    # because somebody else's page moves, which no push of ours would ever notice.
    - cron: "0 6 * * 1"

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # AGENTS.md's working rule is "typecheck && lint && test, all three clean". CI ran two of the three
      # until 2026-08-14 — the same shape as the client job running `vite build`, which does not typecheck.
      # A rule with no mechanism behind it is a preference.
      - run: npm run lint

      - run: npm run test -- --run

  # Documentation drift. Offline checks run on every push; external links only on the weekly
  # schedule, because a third party's 404 is not a reason to fail somebody's pull request.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check docs (offline — source refs, relative links, anchors)
        run: node scripts/check-docs.mjs

      - name: Check external links
        if: github.event_name == 'schedule'
        run: node scripts/check-docs.mjs --links

      # Added 2026-08-13. Ratchets against scripts/route-coverage-baseline.json: a NEW route with no test
      # naming it fails the build; the 47 already uncovered are carried as visible, shrinkable debt. This
      # is the mechanical form of "what was supposed to have caught this?" — the question that found more
      # real defects during the Phase 5 remediation than reading code did.
      - name: Check route coverage (no new untested endpoints)
        run: node scripts/check-route-coverage.mjs

      # Added 2026-08-17 (§7.3). Offline every push: the baseline must stay sorted, duplicate-free and
      # consistent with the claim mapping. Live only on the weekly schedule, for the same reason
      # `--links` is weekly — an Authlete configuration change is somebody else's action, not a reason
      # to fail somebody's pull request.
      - name: Check discovery baseline (offline)
        run: node scripts/check-discovery.mjs

      # Reports member drift BY NAME and cross-checks README's feature claims against the live
      # document. Exists because on 2026-08-17 the document measured 66 members against a recorded 65
      # and the extra member was UNATTRIBUTABLE — August had kept a count and not a list.
      - name: Check discovery document against README claims
        if: github.event_name == 'schedule'
        run: node scripts/check-discovery.mjs --live

      # Added 2026-08-21. The client's entire semantic palette was dead: Tailwind v4 generates utilities
      # from `@theme`, `globals.css` declared the values on `:root` only, and ~160 usages of `bg-card`,
      # `border-border`, `text-muted-foreground`, `bg-muted`, `bg-input`, `ring-ring`, `bg-background` and
      # `text-foreground` across 28 files compiled to nothing. Every other gate stayed green because the
      # symptoms were purely visual — transparent cards, invisible borders, and no visible keyboard focus
      # anywhere, since the form primitives pair `ring-ring` with `focus:outline-none`. Neither `tsc`,
      # ESLint, vitest nor `vite build` can see a class that does not exist. This can, offline.
      - name: Check theme tokens (every semantic utility is mapped in @theme)
        run: node scripts/check-theme-tokens.mjs

  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Added 2026-08-13. CI ran `build` alone, and `vite build` does not typecheck — so `npm run typecheck`
      # existed in package.json and was never invoked, while 4 real type errors sat unnoticed, and the 16
      # client test files never ran in CI at all. The server job has gated all three from the start; the
      # client job gating only the bundler was the asymmetry that hid them.
      - run: npm run typecheck

      # Added 2026-08-14, and it had never run: `npm run lint` existed in package.json from the start and
      # CI never invoked it. It was failing with 4 errors and 7 warnings — two of the errors were an ESLint
      # config bug (`no-undef` applied to TypeScript, which does not know the TS lib types), and the other
      # two were setState-inside-an-effect in ParSection. Same shape as the typecheck gap above: the script
      # existed, the mechanism did not.
      - run: npm run lint

      - run: npm run test

      - run: npm run build
