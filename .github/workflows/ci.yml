name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC — only the external link check needs this. Documentation rots
    # because somebody else's page moves, which no push of ours would ever notice.
    - cron: "0 6 * * 1"

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # AGENTS.md's working rule is "typecheck && lint && test, all three clean". CI ran two of the three
      # until 2026-08-14 — the same shape as the client job running `vite build`, which does not typecheck.
      # A rule with no mechanism behind it is a preference.
      - run: npm run lint

      - run: npm run test -- --run

  # Documentation drift. Offline checks run on every push; external links only on the weekly
  # schedule, because a third party's 404 is not a reason to fail somebody's pull request.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check docs (offline — source refs, relative links, anchors)
        run: node scripts/check-docs.mjs

      - name: Check external links
        if: github.event_name == 'schedule'
        run: node scripts/check-docs.mjs --links

      # Added 2026-08-13. Ratchets against scripts/route-coverage-baseline.json: a NEW route with no test
      # naming it fails the build; the 47 already uncovered are carried as visible, shrinkable debt. This
      # is the mechanical form of "what was supposed to have caught this?" — the question that found more
      # real defects during the Phase 5 remediation than reading code did.
      - name: Check route coverage (no new untested endpoints)
        run: node scripts/check-route-coverage.mjs

      # Added 2026-08-17 (§7.3). Offline every push: the baseline must stay sorted, duplicate-free and
      # consistent with the claim mapping. Live only on the weekly schedule, for the same reason
      # `--links` is weekly — an Authlete configuration change is somebody else's action, not a reason
      # to fail somebody's pull request.
      - name: Check discovery baseline (offline)
        run: node scripts/check-discovery.mjs

      # Reports member drift BY NAME and cross-checks README's feature claims against the live
      # document. Exists because on 2026-08-17 the document measured 66 members against a recorded 65
      # and the extra member was UNATTRIBUTABLE — August had kept a count and not a list.
      - name: Check discovery document against README claims
        if: github.event_name == 'schedule'
        run: node scripts/check-discovery.mjs --live

      # Added 2026-08-21. The client's entire semantic palette was dead: Tailwind v4 generates utilities
      # from `@theme`, `globals.css` declared the values on `:root` only, and ~160 usages of `bg-card`,
      # `border-border`, `text-muted-foreground`, `bg-muted`, `bg-input`, `ring-ring`, `bg-background` and
      # `text-foreground` across 28 files compiled to nothing. Every other gate stayed green because the
      # symptoms were purely visual — transparent cards, invisible borders, and no visible keyboard focus
      # anywhere, since the form primitives pair `ring-ring` with `focus:outline-none`. Neither `tsc`,
      # ESLint, vitest nor `vite build` can see a class that does not exist. This can, offline.
      - name: Check theme tokens (every semantic utility is mapped in @theme)
        run: node scripts/check-theme-tokens.mjs

      # Added 2026-08-21. The client's error decoder turns `[Annnnnn]` into an explanation, and the
      # vendor half of that table is generated from docs/openapi-spec.json rather than written, so no
      # entry can be an invented explanation of a vendor code. This asserts the generated file still
      # matches the spec it was generated from — an SDK or spec bump that moves a result message shows
      # up here instead of silently leaving a stale explanation on screen.
      - name: Check Authlete code table matches the vendored spec
        run: node scripts/extract-authlete-codes.mjs --check

      # Added 2026-08-22. The client's explanation registry had eight holes nothing could see: a section
      # the code asked for and that did not exist, three entries written and never rendered, a missing
      # grant tab, four MCP orphans, one doc defined inline outside the registry, and a README covering
      # 13 of 20 sections. All mechanically detectable — the same argument check-route-coverage makes
      # about endpoints, asked of documentation instead.
      - name: Check client docs (every key exists, every entry is reachable, README covers every section)
        run: node scripts/check-client-docs.mjs

  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Added 2026-08-13. CI ran `build` alone, and `vite build` does not typecheck — so `npm run typecheck`
      # existed in package.json and was never invoked, while 4 real type errors sat unnoticed, and the 16
      # client test files never ran in CI at all. The server job has gated all three from the start; the
      # client job gating only the bundler was the asymmetry that hid them.
      - run: npm run typecheck

      # Added 2026-08-14, and it had never run: `npm run lint` existed in package.json from the start and
      # CI never invoked it. It was failing with 4 errors and 7 warnings — two of the errors were an ESLint
      # config bug (`no-undef` applied to TypeScript, which does not know the TS lib types), and the other
      # two were setState-inside-an-effect in ParSection. Same shape as the typecheck gap above: the script
      # existed, the mechanism did not.
      - run: npm run lint

      # Added 2026-08-22, and the third instance of the same shape: `format` sat in package.json from
      # the start and CI never invoked it, exactly as `typecheck` and `lint` had. It was failing on 64
      # files before anyone looked, and a further 23 were added on top without a word from any gate.
      # A script with no mechanism behind it is a preference.
      #
      # `.prettierignore` excludes `src/data/*.generated.ts`: `extract-authlete-codes.mjs --check`
      # asserts that file is byte-identical to what the generator emits, so reformatting it would break
      # that check on the next run for no benefit.
      - run: npm run format

      - run: npm run test

      # Added 2026-08-22. Ratcheting thresholds, set just under what the suite achieves, so coverage can
      # only go up — the same shape as the server's route-coverage baseline. The logic layer is held far
      # higher than the components (utils 90%, services 75%) because that is where the decisions live;
      # a section component is mostly markup and its smoke test asserts that it mounts and offers a
      # control rather than driving every branch.
      - run: npm run test:coverage

      # Added 2026-08-21/22. Three offline checks nothing else can perform: that every semantic colour
      # utility is mapped in @theme (~160 usages once compiled to nothing), that the generated Authlete
      # result-code table still matches the vendored spec it came from, and that every documentation key
      # exists, every entry is reachable and the README covers every section.
      - run: npm run check:theme
      - run: npm run check:codes
      - run: npm run check:docs

      # Added 2026-08-22. The light theme shipped compiling but unusable: 25 of 26 accent colours
      # failed WCAG AA against every light surface — `text-amber-200` at 1.25:1 — because they were
      # chosen against a near-black ground and inherited unchanged when the second palette arrived.
      # Nothing could see it, because a colour that fails contrast is still a valid colour. This reads
      # the real oklch values out of the built stylesheet and scores both themes.
      #
      # Extended the same day, after axe found a **serious** contrast failure this check had passed:
      # `text-muted-foreground/60` on the sidebar group labels. The script scored the *token*, which
      # clears AA, and never composited the `/60`. It now scores every semantic token rather than five,
      # refuses an opacity modifier on any text colour as unscoreable, and scores `accent-foreground`
      # against every button gradient stop taking the **worst** — which is how the primary and danger
      # buttons turned out to fail at 2.98:1 and 2.77:1 on hover.
      - run: npm run check:contrast

      - run: npm run build

      # Added 2026-08-22. Rendering — the defect class the eight gates above structurally cannot see.
      #
      # Everything before this point reads source or a built artefact. None of it can see a layout that
      # overflows, a control that disappears below a breakpoint, a colour composited over two
      # translucent layers, or an `aria-live` region that was never in the accessibility tree. The first
      # run found five real defects behind an all-green board: the **Token Vault was unreachable below
      # 1024px** (`sidebarHeader` went only to a sidebar that is `hidden lg:flex`), `role="list"` with no
      # `listitem` children so nine flow diagrams announced as empty, a scrollable region no keyboard
      # could reach, seven `opacity-50` wizard steps failing contrast on their prose, and — visible only
      # in a screenshot — every backtick and asterisk in the teaching corpus rendering **literally**.
      #
      # Two engines: Gecko and Blink disagree most on flex shrink, `min-width: auto` on grid children and
      # container queries, which is most of what this application's layout is made of. WebKit is omitted
      # because Safari is not a target audience and it would triple the baselines.
      #
      # `--with-deps` installs the OS libraries the bundled browsers need on a clean runner. It is not
      # required locally, where they were already present.
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:visual

      - name: Upload the Playwright report when rendering fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
