version: "1"
services:
  - type: web
    name: OAUTH2.0
    runtime: node
    repo: https://github.com/blackadi/OAUTH2.0
    plan: free
    envVars:
      - key: JWKS_URI
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_PRIVATE_KEY_PEM
        sync: false
      - key: JWT_PUBLIC_KEY_PEM
        sync: false
      - key: AUTH_USERS
        sync: false
      - key: LOGOUT_REDIRECT_URI
        sync: false
      - key: LOGOUT_CLIENT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: MORGAN_FORMAT
        sync: false
      # Pinned, not `sync: false`. This was unset in the dashboard, and `app.config.ts` used to default it
      # to "development" — so `middleware/development-only.ts` never fired and POST /api/device/complete,
      # a token-minting oracle, was reachable on the public internet. The default now fails safe; this
      # makes the intent explicit as well, so neither layer alone is load-bearing.
      - key: NODE_ENV
        value: production
      # Pinned for the same reason as NODE_ENV directly above, and found the same way. The repo tested on
      # Node 22 in CI and shipped to whatever Render happened to default to — so a green build never implied
      # a working deploy, and nothing in the tree declared the floor. `.nvmrc` and `engines.node` say 22 too;
      # three layers, none of them load-bearing alone. Raising this is a deliberate act: change all three.
      - key: NODE_VERSION
        value: "22"

      - key: PORT
        sync: false
      - key: AUTHLETE_SERVICE_ID
        sync: false
      # Pinned, not `sync: false`, for the same reason as NODE_ENV above — and found the same way.
      # The dashboard held `https://eu.authlete.com` while service 2147478188 lives on **us**, so the
      # SDK authenticated against the wrong region and Authlete answered `A458101 The access token
      # presented is not valid` to every call. `/api/health` still returned 200, so the deployment
      # looked alive while discovery, PAR, authorization, token and introspection were all 403 —
      # invisible to every gate in the repo, because no check reaches a third party.
      #
      # The region is a property of the service, not of the environment, so it does not belong in
      # unversioned dashboard config. Changing service means changing this line.
      - key: AUTHLETE_BASE_URL
        value: https://us.authlete.com
      - key: AUTHLETE_BEARER_TOKEN
        sync: false
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    rootDir: server

  - type: web
    name: client
    runtime: static
    repo: https://github.com/blackadi/OAUTH2.0
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    previews:
      generation: automatic
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # NO trailing slash. `config.ts` builds 62 endpoints as `${API_BASE_URL}/api/...`, so a trailing
      # slash yields `...onrender.com//api/authorization`, which `new URL()` preserves and Express 5
      # answers 404 for — i.e. every API call in the SPA, invisible to every gate in the repo. The value
      # is normalised in `config.ts` as well; neither layer is load-bearing alone, same as NODE_ENV above.
      - key: VITE_API_BASE_URL
        value: https://oauth2-0-ekh2.onrender.com
      - key: VITE_REDIRECT_URI
        sync: false
      - key: VITE_SCOPES
        value: openid profile email
    rootDir: client
    autoDeployTrigger: commit
